    <text x="205" y="27" font-size="13" font-weight="bold" fill="#0F2D6B" text-anchor="middle">UC13: Duyệt / Từ chối GPLX người dùng</text>
  </g>
  <g transform="translate(800, 360)">
    <rect width="410" height="44" rx="22" fill="#FFFFFF" stroke="#0F2D6B" stroke-width="1.8" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="bold" fill="#0F2D6B" text-anchor="middle">UC14: Xác nhận / Từ chối đơn đặt xe (Pending)</text>
  </g>
  <g transform="translate(800, 415)">
    <rect width="410" height="44" rx="22" fill="#FFFFFF" stroke="#0F2D6B" stroke-width="1.8" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="bold" fill="#0F2D6B" text-anchor="middle">UC15: Lập biên bản giao xe (thu cọc &amp; thu tiền mặt)</text>
  </g>
  <g transform="translate(800, 470)">
    <rect width="410" height="44" rx="22" fill="#FFFFFF" stroke="#0F2D6B" stroke-width="1.8" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="bold" fill="#0F2D6B" text-anchor="middle">UC16: Lập biên bản nhận lại xe &amp; quyết toán cọc</text>
  </g>
  <g transform="translate(800, 525)">
    <rect width="410" height="44" rx="22" fill="#FFFFFF" stroke="#0F2D6B" stroke-width="1.8" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="bold" fill="#0F2D6B" text-anchor="middle">UC17: Huỷ đơn bảo trợ &amp; hoàn tiền 100%</text>
  </g>
  <g transform="translate(800, 580)">
    <rect width="410" height="44" rx="22" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="800" fill="#1E40AF" text-anchor="middle">UC18: Xem danh sách thanh toán &amp; tổng hoàn (G7)</text>
  </g>
  <g transform="translate(800, 635)">
    <rect width="410" height="44" rx="22" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="800" fill="#1E40AF" text-anchor="middle">UC19: Trả lời phiếu hỗ trợ &amp; gửi thông báo (G7)</text>
  </g>
  <g transform="translate(800, 690)">
    <rect width="410" height="44" rx="22" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="800" fill="#1E40AF" text-anchor="middle">UC20: Gán vai trò nhân viên &amp; khoá tài khoản (G7)</text>
  </g>
  <g transform="translate(800, 745)">
    <rect width="410" height="44" rx="22" fill="#FFFFFF" stroke="#0F2D6B" stroke-width="1.8" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="bold" fill="#0F2D6B" text-anchor="middle">UC21: Kiểm duyệt &amp; xoá đánh giá vi phạm</text>
  </g>
  <g transform="translate(800, 800)">
    <rect width="410" height="44" rx="22" fill="#FFFFFF" stroke="#0F2D6B" stroke-width="1.8" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="bold" fill="#0F2D6B" text-anchor="middle">UC22: Xem báo cáo doanh thu &amp; đơn thuê</text>
  </g>

  <!-- ==================== HỆ THỐNG USE CASES (BOTTOM ROW: y=880) ==================== -->
  <g transform="translate(420, 880)">
    <rect width="250" height="46" rx="23" fill="#FFFFFF" stroke="#FFB700" stroke-width="1.8" filter="url(#shadow)" />
    <text x="125" y="28" font-size="12.5" font-weight="bold" fill="#B45309" text-anchor="middle">UC23: Kiểm tra trùng lịch xe</text>
  </g>
  <g transform="translate(685, 880)">
    <rect width="250" height="46" rx="23" fill="#FFFFFF" stroke="#FFB700" stroke-width="1.8" filter="url(#shadow)" />
    <text x="125" y="28" font-size="12.5" font-weight="bold" fill="#B45309" text-anchor="middle">UC24: Tự động tính giá &amp; hoàn tiền</text>
  </g>
  <g transform="translate(950, 880)">
