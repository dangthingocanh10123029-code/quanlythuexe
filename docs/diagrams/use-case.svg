  <g transform="translate(800, 195)">
    <rect width="410" height="44" rx="22" fill="#FFFFFF" stroke="#0F2D6B" stroke-width="1.8" filter="url(#shadow)" />
    <text x="205" y="27" font-size="13" font-weight="bold" fill="#0F2D6B" text-anchor="middle">UC11: Quản lý xe &amp; nạp dữ liệu xe mẫu (seedCars)</text>
  </g>
  <g transform="translate(800, 250)">
