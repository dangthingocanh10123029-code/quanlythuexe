<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A65E6" />
      <stop offset="100%" stop-color="#1054CF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <linearGradient id="darkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D6B" />
      <stop offset="100%" stop-color="#081B44" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A2560" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="1180" fill="#FFFFFF" />

  <!-- Title Header -->
  <g transform="translate(60, 35)">
    <rect width="1480" height="70" rx="16" fill="url(#primaryGrad)" filter="url(#shadow)" />
    <text x="740" y="44" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SƠ ĐỒ USE CASE HỆ THỐNG RENTO</text>
    <text x="740" y="62" font-size="13.5" font-weight="500" fill="#E0ECFF" text-anchor="middle">Phân rã chức năng theo 3 vai trò: Khách hàng · Quản trị viên &amp; Nhân viên (staff) · Hệ thống</text>
  </g>

  <!-- System Boundary Box -->
  <rect x="360" y="130" width="880" height="840" rx="22" fill="#F8FAFD" stroke="#DCE7F8" stroke-width="2" />
  <rect x="380" y="145" width="840" height="34" rx="9" fill="#EBF3FF" />
  <text x="800" y="168" font-size="14.5" font-weight="700" fill="#1054CF" text-anchor="middle" letter-spacing="1">RANH GIỚI HỆ THỐNG (RENTO APP &amp; FIRESTORE BACKEND)</text>

  <!-- ACTOR 1: KHÁCH HÀNG (LEFT) -->
  <g transform="translate(60, 360)">
    <rect width="260" height="300" rx="20" fill="#FFFFFF" stroke="#1054CF" stroke-width="2" filter="url(#shadow)" />
    <rect x="15" y="15" width="230" height="50" rx="12" fill="url(#primaryGrad)" />
    <text x="130" y="46" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">KHÁCH HÀNG</text>
    <circle cx="130" cy="115" r="24" fill="#EBF3FF" stroke="#1054CF" stroke-width="2.5" />
    <path d="M95 185 C95 150, 165 150, 165 185" fill="#EBF3FF" stroke="#1054CF" stroke-width="2.5" />
    <text x="130" y="215" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Người dùng di động</text>
    <text x="130" y="235" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Thuê xe tự lái</text>
    <text x="130" y="255" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">TP.HCM · Hà Nội · Đà Nẵng</text>
    <text x="130" y="275" font-size="11" font-weight="600" fill="#1054CF" text-anchor="middle">Đăng nhập tài khoản / Khách</text>
  </g>

  <!-- ACTOR 2: QUẢN TRỊ VIÊN & NHÂN VIÊN (RIGHT) -->
  <g transform="translate(1280, 350)">
    <rect width="260" height="320" rx="20" fill="#FFFFFF" stroke="#0F2D6B" stroke-width="2" filter="url(#shadow)" />
    <rect x="15" y="15" width="230" height="50" rx="12" fill="url(#darkBlueGrad)" />
    <text x="130" y="46" font-size="16.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">QUẢN TRỊ VIÊN</text>
    <circle cx="130" cy="115" r="24" fill="#F0F4FA" stroke="#0F2D6B" stroke-width="2.5" />
    <path d="M95 185 C95 150, 165 150, 165 185" fill="#F0F4FA" stroke="#0F2D6B" stroke-width="2.5" />
    <path d="M120 82 L125 90 L130 80 L135 90 L140 82 L140 94 L120 94 Z" fill="#FFB700" />
    
    <text x="130" y="212" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Admin &amp; Nhân viên (staff)</text>
    <text x="130" y="230" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">isAdmin=true: toàn quyền hệ thống</text>
    
    <rect x="15" y="244" width="230" height="60" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <text x="130" y="262" font-size="11.5" font-weight="800" fill="#B45309" text-anchor="middle">Ghi chú vai trò (G7):</text>
    <text x="130" y="278" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">Nhân viên (staff): như quản trị</text>
    <text x="130" y="294" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">trừ quản lý người dùng</text>
  </g>

  <!-- ACTOR 3: HỆ THỐNG TỰ ĐỘNG (BOTTOM CENTER) -->
  <g transform="translate(660, 995)">
    <rect width="280" height="76" rx="18" fill="#FFFFFF" stroke="#FFB700" stroke-width="2" filter="url(#shadow)" />
    <rect x="8" y="8" width="264" height="60" rx="12" fill="#FFF9E6" />
    <circle cx="42" cy="38" r="20" fill="url(#goldGrad)" />
    <g transform="translate(30, 26) scale(1.05)">
      <circle cx="12" cy="12" r="5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M12 2v3m0 14v3M2 12h3m14 0h3m-3.5-6.5l-2.1 2.1m-9.8 9.8l-2.1 2.1m0-14l2.1 2.1m9.8 9.8l2.1 2.1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="150" y="34" font-size="15" font-weight="800" fill="#B45309">HỆ THỐNG RENTO</text>
    <text x="150" y="53" font-size="11.5" font-weight="500" fill="#78350F">Backend &amp; Logic tự động</text>
  </g>

  <!-- Lines connecting Khách to use cases -->
  <g stroke="#1054CF" stroke-width="1.4" opacity="0.6">
    <line x1="320" y1="410" x2="390" y2="217" />
    <line x1="320" y1="430" x2="390" y2="272" />
    <line x1="320" y1="450" x2="390" y2="327" />
    <line x1="320" y1="470" x2="390" y2="382" />
    <line x1="320" y1="490" x2="390" y2="437" />
    <line x1="320" y1="510" x2="390" y2="492" />
    <line x1="320" y1="530" x2="390" y2="547" />
    <line x1="320" y1="550" x2="390" y2="602" />
    <line x1="320" y1="570" x2="390" y2="657" />
    <line x1="320" y1="590" x2="390" y2="712" />
  </g>

  <!-- Lines connecting Admin to use cases -->
  <g stroke="#0F2D6B" stroke-width="1.4" opacity="0.6">
    <line x1="1280" y1="390" x2="1190" y2="217" />
    <line x1="1280" y1="410" x2="1190" y2="272" />
    <line x1="1280" y1="430" x2="1190" y2="327" />
    <line x1="1280" y1="450" x2="1190" y2="382" />
    <line x1="1280" y1="470" x2="1190" y2="437" />
    <line x1="1280" y1="490" x2="1190" y2="492" />
    <line x1="1280" y1="510" x2="1190" y2="547" />
    <line x1="1280" y1="530" x2="1190" y2="602" />
    <line x1="1280" y1="550" x2="1190" y2="657" />
    <line x1="1280" y1="570" x2="1190" y2="712" />
    <line x1="1280" y1="590" x2="1190" y2="767" />
    <line x1="1280" y1="610" x2="1190" y2="822" />
