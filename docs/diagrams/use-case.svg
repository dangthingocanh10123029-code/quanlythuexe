    <circle cx="210" cy="10" r="6" fill="#0F2D6B" />
    <text x="224" y="14" font-size="12" font-weight="600" fill="#334155">Use case Quản trị viên</text>

    <rect x="420" y="3" width="14" height="14" rx="4" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5" />
    <text x="444" y="14" font-size="12" font-weight="700" fill="#1E40AF">Tính năng mở rộng G7</text>

    <circle cx="630" cy="10" r="6" fill="#FFB700" />
