  <!-- Lines connecting System to use cases -->
  <g stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8">
    <line x1="750" y1="995" x2="570" y2="925" />
    <line x1="800" y1="995" x2="800" y2="925" />
    <line x1="850" y1="995" x2="1030" y2="925" />
