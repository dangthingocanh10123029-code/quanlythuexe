  <!-- ==================== KHÁCH HÀNG USE CASES (LEFT: x=390, w=390) ==================== -->
  <g transform="translate(390, 195)">
    <rect width="390" height="44" rx="22" fill="#FFFFFF" stroke="#1054CF" stroke-width="1.8" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="bold" fill="#1054CF" text-anchor="middle">UC01: Đăng ký, đăng nhập &amp; OTP (SĐT, CCCD)</text>
  </g>
  <g transform="translate(390, 250)">
    <rect width="390" height="44" rx="22" fill="#FFFFFF" stroke="#1054CF" stroke-width="1.8" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="bold" fill="#1054CF" text-anchor="middle">UC02: Tìm kiếm &amp; lọc xe theo ngày trống</text>
  </g>
  <g transform="translate(390, 305)">
    <rect width="390" height="44" rx="22" fill="#FFFFFF" stroke="#1054CF" stroke-width="1.8" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="bold" fill="#1054CF" text-anchor="middle">UC03: Đặt xe &amp; áp mã giảm giá (FIRST20)</text>
  </g>
  <g transform="translate(390, 360)">
    <rect width="390" height="44" rx="22" fill="#FFFFFF" stroke="#1054CF" stroke-width="1.8" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="bold" fill="#1054CF" text-anchor="middle">UC04: Gửi hồ sơ GPLX trực tuyến (B1, B2, C)</text>
  </g>
  <g transform="translate(390, 415)">
    <rect width="390" height="44" rx="22" fill="#FFFFFF" stroke="#1054CF" stroke-width="1.8" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="bold" fill="#1054CF" text-anchor="middle">UC05: Thanh toán online (Thẻ / MoMo / ZaloPay)</text>
  </g>
  <g transform="translate(390, 470)">
    <rect width="390" height="44" rx="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="800" fill="#1E40AF" text-anchor="middle">UC06: Chọn trả tiền mặt khi nhận xe (G7)</text>
  </g>
  <g transform="translate(390, 525)">
    <rect width="390" height="44" rx="22" fill="#FFFFFF" stroke="#1054CF" stroke-width="1.8" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="bold" fill="#1054CF" text-anchor="middle">UC07: Huỷ đơn (hoàn tiền) &amp; Đổi lịch thuê</text>
  </g>
  <g transform="translate(390, 580)">
    <rect width="390" height="44" rx="22" fill="#FFFFFF" stroke="#1054CF" stroke-width="1.8" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="bold" fill="#1054CF" text-anchor="middle">UC08: Đánh giá chuyến đi (sao &amp; nhận xét)</text>
  </g>
  <g transform="translate(390, 635)">
    <rect width="390" height="44" rx="22" fill="#FFFFFF" stroke="#1054CF" stroke-width="1.8" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="bold" fill="#1054CF" text-anchor="middle">UC09: Quản lý danh sách xe yêu thích</text>
  </g>
  <g transform="translate(390, 690)">
    <rect width="390" height="44" rx="22" fill="#FFFFFF" stroke="#1054CF" stroke-width="1.8" filter="url(#shadow)" />
    <text x="195" y="27" font-size="13" font-weight="bold" fill="#1054CF" text-anchor="middle">UC10: Xem thông báo &amp; gửi phiếu hỗ trợ</text>
  </g>

