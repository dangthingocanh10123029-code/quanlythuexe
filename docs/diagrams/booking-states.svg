<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A65E6" />
      <stop offset="100%" stop-color="#1054CF" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1054CF" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E11D48" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706" />
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <filter id="cardSh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A2560" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1050" fill="#FFFFFF" />

  <!-- Title Header -->
  <g transform="translate(80, 40)">
    <rect width="1440" height="70" rx="16" fill="url(#titleGrad)" filter="url(#cardSh)" />
    <text x="720" y="44" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SƠ ĐỒ TRẠNG THÁI ĐƠN THUÊ XE (BOOKING LIFE-CYCLE)</text>
    <text x="720" y="62" font-size="14" font-weight="500" fill="#E0ECFF" text-anchor="middle">Đặc tả luồng chuyển trạng thái (D2), tác nhân thực hiện &amp; chính sách hoàn tiền</text>
  </g>

  <!-- START NODE -->
  <g transform="translate(50, 260)">
    <circle cx="25" cy="45" r="16" fill="#1054CF" />
    <circle cx="25" cy="45" r="8" fill="#FFFFFF" />
    <text x="25" y="78" font-size="11" font-weight="bold" fill="#1054CF" text-anchor="middle">BẮT ĐẦU</text>
    <!-- Transition to Pending -->
    <path d="M 45 45 L 90 45" stroke="#1054CF" stroke-width="2.5" marker-end="url(#arrowBlue)" />
    <text x="68" y="34" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">Tạo đơn</text>
  </g>

  <!-- STATE 1: PENDING (x=160, w=180) -->
  <g transform="translate(160, 215)" filter="url(#cardSh)">
    <rect width="180" height="90" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" />
    <rect x="10" y="10" width="160" height="26" rx="6" fill="#FEF3C7" />
    <text x="90" y="28" font-size="13" font-weight="800" fill="#B45309" text-anchor="middle">PENDING</text>
    <text x="90" y="58" font-size="15" font-weight="800" fill="#92400E" text-anchor="middle">Chờ xác nhận</text>
    <text x="90" y="76" font-size="10" font-weight="500" fill="#B45309" text-anchor="middle">Chưa giữ xe · Chưa trả tiền</text>
  </g>

  <!-- TRANSITION 1 -> 2: Admin xác nhận -->
  <g>
    <path d="M 340 260 L 460 260" stroke="#1054CF" stroke-width="2.5" marker-end="url(#arrowBlue)" />
    <rect x="350" y="218" width="100" height="22" rx="5" fill="#EBF3FF" />
    <text x="400" y="234" font-size="10.5" font-weight="bold" fill="#1054CF" text-anchor="middle">Admin xác nhận</text>
    <text x="400" y="280" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">Kiểm tra trùng lịch</text>
  </g>

  <!-- STATE 2: CONFIRMED (x=470, w=180) -->
  <g transform="translate(470, 215)" filter="url(#cardSh)">
    <rect width="180" height="90" rx="16" fill="#EFF6FF" stroke="#1054CF" stroke-width="2.5" />
    <rect x="10" y="10" width="160" height="26" rx="6" fill="#DBEAFE" />
    <text x="90" y="28" font-size="13" font-weight="800" fill="#1E40AF" text-anchor="middle">CONFIRMED</text>
    <text x="90" y="58" font-size="15" font-weight="800" fill="#1E3A8A" text-anchor="middle">Chờ thanh toán</text>
    <text x="90" y="76" font-size="10" font-weight="500" fill="#1D4ED8" text-anchor="middle">Tạm giữ xe · Mở thanh toán</text>
  </g>

  <!-- TRANSITION 2 -> 1: Khách đổi lịch (Arch Back) -->
  <g>
    <path d="M 540 215 C 540 145, 270 145, 270 210" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowOrange)" />
    <rect x="350" y="145" width="110" height="24" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <text x="405" y="161" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">Khách đổi lịch</text>
    <text x="405" y="182" font-size="10" font-weight="500" fill="#92400E" text-anchor="middle">(Tính lại giá &amp; duyệt lại)</text>
  </g>

  <!-- TRANSITION 2 -> 3: Khách thanh toán -->
  <g>
    <path d="M 650 260 L 770 260" stroke="#1054CF" stroke-width="2.5" marker-end="url(#arrowBlue)" />
    <rect x="660" y="218" width="100" height="22" rx="5" fill="#EBF3FF" />
    <text x="710" y="234" font-size="10.5" font-weight="bold" fill="#1054CF" text-anchor="middle">Khách thanh toán</text>
    <text x="710" y="280" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">MoMo / ZaloPay / Thẻ</text>
  </g>

  <!-- STATE 3: UPCOMING (x=780, w=180) -->
  <g transform="translate(780, 215)" filter="url(#cardSh)">
    <rect width="180" height="90" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.5" />
    <rect x="10" y="10" width="160" height="26" rx="6" fill="#E0E7FF" />
    <text x="90" y="28" font-size="13" font-weight="800" fill="#4338CA" text-anchor="middle">UPCOMING</text>
    <text x="90" y="58" font-size="15" font-weight="800" fill="#3730A3" text-anchor="middle">Sắp nhận xe</text>
    <text x="90" y="76" font-size="10" font-weight="500" fill="#4F46E5" text-anchor="middle">Đã trả tiền · Chờ đến hẹn</text>
  </g>

  <!-- TRANSITION 3 -> 4: Admin giao xe -->
  <g>
    <path d="M 960 260 L 1080 260" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" />
    <rect x="975" y="218" width="90" height="22" rx="5" fill="#ECFDF5" />
    <text x="1020" y="234" font-size="10.5" font-weight="bold" fill="#059669" text-anchor="middle">Admin giao xe</text>
    <text x="1020" y="280" font-size="9.5" font-weight="500" fill="#047857" text-anchor="middle">Thu cọc &amp; ký biên bản</text>
  </g>

  <!-- STATE 4: ACTIVE (x=1090, w=180) -->
  <g transform="translate(1090, 215)" filter="url(#cardSh)">
    <rect width="180" height="90" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5" />
    <rect x="10" y="10" width="160" height="26" rx="6" fill="#D1FAE5" />
    <text x="90" y="28" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">ACTIVE</text>
    <text x="90" y="58" font-size="15" font-weight="800" fill="#065F46" text-anchor="middle">Đang thuê</text>
    <text x="90" y="76" font-size="10" font-weight="500" fill="#059669" text-anchor="middle">Xe đổi sang 'Rented'</text>
  </g>

  <!-- TRANSITION 4 -> 5: Admin nhận xe -->
  <g>
    <path d="M 1270 260 L 1370 260" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" />
    <rect x="1280" y="218" width="85" height="22" rx="5" fill="#ECFDF5" />
    <text x="1322" y="234" font-size="10.5" font-weight="bold" fill="#059669" text-anchor="middle">Admin nhận xe</text>
    <text x="1322" y="280" font-size="9.5" font-weight="500" fill="#047857" text-anchor="middle">Quyết toán cọc</text>
  </g>

  <!-- STATE 5: COMPLETED (x=1380, w=170) -->
  <g transform="translate(1380, 215)" filter="url(#cardSh)">
    <rect width="170" height="90" rx="16" fill="#F0FDFA" stroke="#0F766E" stroke-width="3" />
    <rect x="10" y="10" width="150" height="26" rx="6" fill="#CCFBF1" />
    <text x="85" y="28" font-size="13" font-weight="800" fill="#115E59" text-anchor="middle">COMPLETED</text>
    <text x="85" y="58" font-size="15" font-weight="800" fill="#134E4A" text-anchor="middle">Hoàn thành</text>
    <text x="85" y="76" font-size="10" font-weight="bold" fill="#0F766E" text-anchor="middle">Mở quyền Đánh giá</text>
  </g>

  <!-- END NODE COMPLETED -->
  <g transform="translate(1465, 320)">
    <circle cx="0" cy="20" r="14" fill="#0F766E" />
    <circle cx="0" cy="20" r="8" fill="#FFFFFF" />
    <circle cx="0" cy="20" r="5" fill="#0F766E" />
  </g>

  <!-- BRANCH 1: REJECTED (FROM PENDING) -->
  <g>
    <path d="M 250 305 L 250 460" stroke="#E11D48" stroke-width="2.5" marker-end="url(#arrowRed)" />
    <rect x="195" y="365" width="110" height="42" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
    <text x="250" y="383" font-size="11" font-weight="bold" fill="#E11D48" text-anchor="middle">Admin từ chối</text>
    <text x="250" y="398" font-size="10" font-weight="500" fill="#9F1239" text-anchor="middle">(Kèm lý do)</text>
  </g>

  <g transform="translate(160, 465)" filter="url(#cardSh)">
    <rect width="180" height="80" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="2.5" />
    <rect x="10" y="10" width="160" height="24" rx="6" fill="#FFE4E6" />
    <text x="90" y="27" font-size="13" font-weight="800" fill="#9F1239" text-anchor="middle">REJECTED</text>
    <text x="90" y="56" font-size="15" font-weight="800" fill="#881337" text-anchor="middle">Bị từ chối</text>
    <text x="90" y="72" font-size="10" font-weight="500" fill="#9F1239" text-anchor="middle">Chuyển vào tab Lịch sử</text>
  </g>

  <!-- BRANCH 2: CANCELLED (FROM PENDING, CONFIRMED, UPCOMING) -->
  <!-- Pending -> Cancelled -->
  <g>
    <path d="M 310 305 C 310 440, 660 440, 660 460" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)" />
    <rect x="345" y="415" width="95" height="22" rx="5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="392" y="430" font-size="10" font-weight="bold" fill="#64748B" text-anchor="middle">Khách huỷ (0đ)</text>
  </g>

  <!-- Confirmed -> Cancelled -->
  <g>
    <path d="M 560 305 C 560 380, 680 380, 680 460" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)" />
    <rect x="525" y="370" width="95" height="22" rx="5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="572" y="385" font-size="10" font-weight="bold" fill="#64748B" text-anchor="middle">Khách huỷ (0đ)</text>
  </g>

  <!-- Upcoming -> Cancelled (Customer) -->
  <g>
    <path d="M 830 305 C 830 385, 760 395, 760 460" fill="none" stroke="#E11D48" stroke-width="2.5" marker-end="url(#arrowRed)" />
    <rect x="735" y="360" width="160" height="42" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
    <text x="815" y="378" font-size="11" font-weight="bold" fill="#E11D48" text-anchor="middle">Khách huỷ (Hoàn tiền)</text>
    <text x="815" y="394" font-size="10" font-weight="bold" fill="#9F1239" text-anchor="middle">≥24h: 100% · &lt;24h: 70%</text>
  </g>

  <!-- Upcoming -> Cancelled (Admin) -->
  <g>
    <path d="M 940 305 C 960 390, 960 480, 845 490" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowRed)" />
    <rect x="910" y="415" width="135" height="26" rx="6" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1" />
    <text x="977" y="432" font-size="10" font-weight="bold" fill="#B91C1C" text-anchor="middle">Admin huỷ: Hoàn 100%</text>
  </g>

  <!-- STATE: CANCELLED (x=650, w=190) -->
  <g transform="translate(650, 465)" filter="url(#cardSh)">
    <rect width="190" height="80" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5" />
    <rect x="10" y="10" width="170" height="24" rx="6" fill="#E2E8F0" />
    <text x="95" y="27" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">CANCELLED</text>
    <text x="95" y="56" font-size="15" font-weight="800" fill="#1E293B" text-anchor="middle">Đã huỷ chuyến</text>
    <text x="95" y="72" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Ghi nhận refundAmount</text>
  </g>

  <!-- NOTE / RESTRICTION CALLOUT -->
  <g transform="translate(1090, 330)">
    <rect width="240" height="42" rx="10" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5" />
    <text x="120" y="22" font-size="11" font-weight="bold" fill="#991B1B" text-anchor="middle">🚫 Đang thuê (Active) KHÔNG THỂ huỷ</text>
    <text x="120" y="35" font-size="10" font-weight="500" fill="#B91C1C" text-anchor="middle">Bắt buộc qua thủ tục nhận lại xe</text>
  </g>

  <!-- BOTTOM PANELS: POLICY & TAB GROUPING -->
  <g transform="translate(80, 600)" filter="url(#cardSh)">
    <rect width="460" height="240" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="460" height="44" rx="18" fill="#1054CF" />
    <rect y="20" width="460" height="24" fill="#1054CF" />
    <text x="24" y="28" font-size="15" font-weight="bold" fill="#FFFFFF">CHÍNH SÁCH HUỶ ĐƠN &amp; HOÀN TIỀN (D5)</text>

    <g transform="translate(24, 65)">
      <circle cx="10" cy="10" r="6" fill="#10B981" />
      <text x="26" y="14" font-size="13" font-weight="bold" fill="#0F172A">Huỷ trước giờ nhận xe ≥ 24 giờ:</text>
      <text x="26" y="32" font-size="13" font-weight="bold" fill="#059669">Hoàn 100% số tiền đã thanh toán</text>

      <circle cx="10" cy="55" r="6" fill="#F59E0B" />
      <text x="26" y="59" font-size="13" font-weight="bold" fill="#0F172A">Huỷ trước giờ nhận xe &lt; 24 giờ:</text>
      <text x="26" y="77" font-size="13" font-weight="bold" fill="#D97706">Hoàn 70% số tiền (phí huỷ 30%)</text>

      <circle cx="10" cy="100" r="6" fill="#3B82F6" />
      <text x="26" y="104" font-size="13" font-weight="bold" fill="#0F172A">Quản trị viên huỷ đơn (sự cố bất khả kháng):</text>
      <text x="26" y="122" font-size="13" font-weight="bold" fill="#1054CF">Hoàn 100% toàn bộ tiền thuê cho khách</text>

      <circle cx="10" cy="145" r="6" fill="#64748B" />
      <text x="26" y="149" font-size="13" font-weight="bold" fill="#0F172A">Đơn Pending hoặc Confirmed huỷ:</text>
      <text x="26" y="165" font-size="12" font-weight="500" fill="#64748B">Chưa phát sinh thanh toán → Hoàn 0đ</text>
    </g>
  </g>

  <!-- PANEL 2: TIỀN CỌC & BIÊN BẢN BÀN GIAO (D4) -->
  <g transform="translate(570, 600)" filter="url(#cardSh)">
    <rect width="460" height="240" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="460" height="44" rx="18" fill="#0F2D6B" />
    <rect y="20" width="460" height="24" fill="#0F2D6B" />
    <text x="24" y="28" font-size="15" font-weight="bold" fill="#FFFFFF">TIỀN CỌC &amp; BIÊN BẢN BÀN GIAO (D4, G4)</text>

    <g transform="translate(24, 65)">
      <circle cx="10" cy="10" r="6" fill="#FFB700" />
      <text x="26" y="14" font-size="13" font-weight="bold" fill="#0F172A">Thu tiền cọc khi giao xe:</text>
      <text x="26" y="32" font-size="12" font-weight="500" fill="#475569">Trả cọc lúc nhận xe (không cộng vào thanh toán online)</text>

      <circle cx="10" cy="55" r="6" fill="#1054CF" />
      <text x="26" y="59" font-size="13" font-weight="bold" fill="#0F172A">Biên bản giao xe (Upcoming → Active):</text>
      <text x="26" y="77" font-size="12" font-weight="500" fill="#475569">Ghi nhận số km, mức xăng, checklist giấy tờ &amp; tình trạng xe</text>

      <circle cx="10" cy="100" r="6" fill="#10B981" />
      <text x="26" y="104" font-size="13" font-weight="bold" fill="#0F172A">Biên bản nhận lại xe (Active → Completed):</text>
      <text x="26" y="122" font-size="12" font-weight="500" fill="#475569">Đối soát km, xăng, hư hỏng &amp; phụ phí trễ giờ (10%/h)</text>

      <circle cx="10" cy="145" r="6" fill="#059669" />
      <text x="26" y="149" font-size="13" font-weight="bold" fill="#0F172A">Công thức quyết toán cọc:</text>
      <text x="26" y="167" font-size="13" font-weight="bold" fill="#047857">Hoàn cọc = Tiền cọc ban đầu − Phí phát sinh</text>
    </g>
  </g>

  <!-- PANEL 3: PHÂN NHÓM TAB CHUYẾN ĐI -->
  <g transform="translate(1060, 600)" filter="url(#cardSh)">
    <rect width="460" height="240" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="460" height="44" rx="18" fill="#475569" />
    <rect y="20" width="460" height="24" fill="#475569" />
    <text x="24" y="28" font-size="15" font-weight="bold" fill="#FFFFFF">HIỂN THỊ TRÊN GIAO DIỆN APP (TAB CHUYẾN ĐI)</text>

    <g transform="translate(24, 65)">
      <rect x="0" y="0" width="412" height="44" rx="10" fill="#EFF6FF" />
      <text x="16" y="27" font-size="13" font-weight="bold" fill="#1E40AF">Tab 'Sắp tới':</text>
      <text x="120" y="27" font-size="13" font-weight="600" fill="#1D4ED8">Pending · Confirmed · Upcoming</text>

      <rect x="0" y="56" width="412" height="44" rx="10" fill="#ECFDF5" />
      <text x="16" y="83" font-size="13" font-weight="bold" fill="#065F46">Tab 'Đang thuê':</text>
      <text x="130" y="83" font-size="13" font-weight="600" fill="#047857">Active (xe đang được lưu thông)</text>

      <rect x="0" y="112" width="412" height="44" rx="10" fill="#F8FAFC" />
      <text x="16" y="139" font-size="13" font-weight="bold" fill="#334155">Tab 'Lịch sử':</text>
      <text x="120" y="139" font-size="13" font-weight="600" fill="#475569">Completed · Cancelled · Rejected</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 890)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#1054CF" stroke-width="2.5" marker-end="url(#arrowBlue)" />
    <text x="40" y="14" font-size="12" font-weight="bold" fill="#334155">Luồng tiến triển chính</text>

    <line x1="210" y1="10" x2="240" y2="10" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowOrange)" />
    <text x="250" y="14" font-size="12" font-weight="bold" fill="#334155">Khách đổi lịch thuê</text>

    <line x1="430" y1="10" x2="460" y2="10" stroke="#E11D48" stroke-width="2.5" marker-end="url(#arrowRed)" />
    <text x="470" y="14" font-size="12" font-weight="bold" fill="#334155">Huỷ đơn / Bị từ chối</text>

    <line x1="640" y1="10" x2="670" y2="10" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)" />
    <text x="680" y="14" font-size="12" font-weight="bold" fill="#334155">Giao nhận xe &amp; hoàn cọc</text>
  </g>
</svg>